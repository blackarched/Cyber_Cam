version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nexus-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - nexus-server
    networks:
      - nexus-net

  nexus-server:
    build: .
    container_name: nexus-server
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./src:/app/src:ro
      - ./certs:/app/certs:ro
    networks:
      - nexus-net
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy

  nexus-db:
    image: postgres:15-alpine
    container_name: nexus-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db-data:/var/lib/postgresql/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis-cache
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass $$REDIS_PASSWORD
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-prometheus:
    image: prom/prometheus:latest
    container_name: nexus-metrics-collector
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./certs:/etc/prometheus/certs:ro
      - nexus-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  db-data:
  nexus-prometheus-data: